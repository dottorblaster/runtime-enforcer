name: govulncheck
on:
  push:
    paths:
      - go.sum
      - go.mod
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Golang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true # Always check for the latest patch release
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            pip \
            build-essential \
            libelf-dev \
            clang \
            llvm \
            libbpf-dev
          pip install pre-commit
      - name: Generate eBPF code
        run: make generate-ebpf
      - name: Run govulncheck
        env:
          GOVULNCHECK_VERSION: 617f44b718537dccdea1915395650e0529e3b72e # v1.7.0
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck -C . -format text ./...
